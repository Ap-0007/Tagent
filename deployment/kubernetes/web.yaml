apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagent-web
  namespace: tagent
  labels:
    app: tagent-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tagent-web
  template:
    metadata:
      labels:
        app: tagent-web
    spec:
      containers:
        - name: web
          image: ghcr.io/tagent-dev/web:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://tagent-api-gateway:8080"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tagent-web
  namespace: tagent
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: tagent-web
