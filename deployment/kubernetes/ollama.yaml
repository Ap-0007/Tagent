apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagent-ollama
  namespace: tagent
  labels:
    app: tagent-ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tagent-ollama
  template:
    metadata:
      labels:
        app: tagent-ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 12Gi
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: tagent-ollama-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tagent-ollama-pvc
  namespace: tagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tagent-ollama
  namespace: tagent
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      name: http
  selector:
    app: tagent-ollama
