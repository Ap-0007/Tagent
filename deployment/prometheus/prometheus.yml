global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "tagent-api-gateway"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "tagent-discovery"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "tagent-monitoring"
    static_configs:
      - targets: ["host.docker.internal:8082"]
