name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, discovery, monitoring, remediation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/services/${{ matrix.service }}/go.mod
      - name: Tidy
        working-directory: backend/services/${{ matrix.service }}
        run: go mod tidy
      - name: Build
        working-directory: backend/services/${{ matrix.service }}
        run: go build ./...

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: backend/services/ai-engine
        run: pip install -r requirements.txt ruff
      - name: Lint
        working-directory: backend/services/ai-engine
        run: ruff check .

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
        working-directory: frontend/web
      - run: npm run type-check
        working-directory: frontend/web
      - run: npm run lint
        working-directory: frontend/web
      - run: npm run build
        working-directory: frontend/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - run: helm lint helm-charts/tagent
      - run: helm template tagent helm-charts/tagent
