name: CI · Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "helm-charts/**"
      - ".github/workflows/helm-lint.yml"
  pull_request:
    paths:
      - "helm-charts/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint helm-charts/tagent

      - name: Helm template (dev)
        run: helm template tagent helm-charts/tagent -f helm-charts/tagent/values-development.yaml

      - name: Helm template (prod)
        run: helm template tagent helm-charts/tagent -f helm-charts/tagent/values-production.yaml

      - name: Setup kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          helm template tagent helm-charts/tagent -f helm-charts/tagent/values-production.yaml | \
            kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas
