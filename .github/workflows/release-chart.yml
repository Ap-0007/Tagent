name: Release · Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "helm-charts/**"
      - ".github/workflows/release-chart.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Get chart version
        id: version
        run: |
          VERSION=$(grep '^version:' helm-charts/tagent/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package helm-charts/tagent -d .cr-release-packages

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tagent-${{ steps.version.outputs.version }}"
          gh release create "$TAG" .cr-release-packages/*.tgz --title "$TAG" --notes "Helm chart ${{ steps.version.outputs.version }}" 2>/dev/null || true
          gh release upload "$TAG" .cr-release-packages/*.tgz --clobber 2>/dev/null || true

      - name: Generate index.yaml
        run: |
          TAG="tagent-${{ steps.version.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          helm repo index .cr-release-packages --url "$REPO_URL"
          cp .cr-release-packages/index.yaml /tmp/index.yaml

      - name: Push index to gh-pages
        run: |
          git checkout gh-pages
          cp /tmp/index.yaml index.yaml
          git add index.yaml
          git commit -m "Update Helm chart index" --allow-empty
          git push origin gh-pages
