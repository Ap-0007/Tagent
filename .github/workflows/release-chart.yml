name: Release · Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "helm-charts/**"
      - ".github/workflows/release-chart.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package helm-charts/tagent -d .cr-release-packages

      - name: Upload chart to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tagent-$(grep '^version:' helm-charts/tagent/Chart.yaml | awk '{print $2}')"
          # Create release if it doesn't exist
          gh release create "$TAG" .cr-release-packages/*.tgz --title "$TAG" --notes "Helm chart release" || true
          # Upload package to existing release
          gh release upload "$TAG" .cr-release-packages/*.tgz --clobber || true

      - name: Update gh-pages index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checkout gh-pages
          git checkout gh-pages || git checkout --orphan gh-pages

          # Generate index.yaml
          REPO_URL="https://github.com/${{ github.repository }}/releases/download"
          helm repo index .cr-release-packages --url "$REPO_URL/tagent-$(grep '^version:' helm-charts/tagent/Chart.yaml | awk '{print $2}')"

          # Copy index to root
          cp .cr-release-packages/index.yaml index.yaml

          # Commit and push
          git add index.yaml
          git commit -m "Update Helm chart index" --allow-empty
          git push origin gh-pages --force
