version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      all-frontend:
        patterns: ["*"]
    labels:
      - "dependencies"

  - package-ecosystem: "gomod"
    directory: "/backend/services/api-gateway"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      all-go:
        patterns: ["*"]
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/backend/services/ai-engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      all-python:
        patterns: ["*"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      all-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
