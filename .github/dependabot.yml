version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "frontend"

  # Go - all services (grouped)
  - package-ecosystem: "gomod"
    directory: "/backend/services/api-gateway"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "backend"

  # Python - AI Engine
  - package-ecosystem: "pip"
    directory: "/backend/services/ai-engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "ai-engine"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "ci"
