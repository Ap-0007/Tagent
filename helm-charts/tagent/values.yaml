# Tagent Helm Chart — Default Values
# helm install tagent ./helm-charts/tagent --namespace tagent --create-namespace

createNamespace: false

# ===== SERVICES (Docker Hub: yaswanth111) =====

apiGateway:
  replicaCount: 1
  image:
    repository: yaswanth111/tagent-api-gateway
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

discovery:
  image:
    repository: yaswanth111/tagent-discovery
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

monitoring:
  image:
    repository: yaswanth111/tagent-monitoring
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

aiEngine:
  image:
    repository: yaswanth111/tagent-ai-engine
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }

remediation:
  image:
    repository: yaswanth111/tagent-remediation
    tag: "latest"
    pullPolicy: Always
  mode: "read-only"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

notification:
  image:
    repository: yaswanth111/tagent-notification
    tag: "latest"
    pullPolicy: Always
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

web:
  replicaCount: 1
  image:
    repository: yaswanth111/tagent-web
    tag: "latest"
    pullPolicy: Always
  apiUrl: "http://tagent-api-gateway:8080"
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ===== LOCAL LLM (no cloud APIs) =====

ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  model: "llama3.1:8b"
  embeddingModel: "nomic-embed-text"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: "1", memory: 6Gi }
    limits: { cpu: "4", memory: 12Gi }

# ===== NIGHT GUARDIAN =====

nightGuardian:
  enabled: false
  confidence: "85"

# ===== ESCALATION =====

escalation:
  enabled: false
  phoneDelayMin: "3"
  autoFixDelayMin: "10"
  quietStart: "22:00"
  quietEnd: "06:00"
  minSeverity: "high"

# ===== SECRETS =====

secrets:
  databaseUrl: "postgresql://tagent:tagent123@tagent-postgres:5432/tagent?sslmode=disable"
  redisUrl: "redis://tagent-redis:6379"
  kafkaBrokers: "tagent-kafka:9092"
  slackWebhookUrl: ""
  smtpHost: ""
  smtpUser: ""
  smtpPassword: ""

# ===== KAFKA =====

kafka:
  enabled: true
  persistence:
    enabled: false
    size: 5Gi

# ===== POSTGRESQL =====

postgres:
  enabled: true
  password: "tagent123"
  persistence:
    enabled: false
    size: 5Gi

# ===== PROMETHEUS =====

prometheus:
  serviceMonitor:
    enabled: false # Set to true if you have Prometheus Operator installed

# ===== INGRESS =====

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tagent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ===== RBAC =====

rbac:
  create: true

# ===== IMAGE PULL SECRETS (not needed for Docker Hub public images) =====

imagePullSecrets: []
