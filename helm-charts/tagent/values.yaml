# Tagent Helm Chart — Default Values
# Override with values-development.yaml or values-production.yaml

createNamespace: false

# ===== SERVICES =====

apiGateway:
  replicaCount: 1
  image:
    repository: ghcr.io/tagent-ai/api-gateway
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

discovery:
  image:
    repository: ghcr.io/tagent-ai/discovery
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

monitoring:
  image:
    repository: ghcr.io/tagent-ai/monitoring
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

aiEngine:
  image:
    repository: ghcr.io/tagent-ai/ai-engine
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }

remediation:
  image:
    repository: ghcr.io/tagent-ai/remediation
    tag: ""
    pullPolicy: IfNotPresent
  mode: "read-only" # read-only | approval-required | auto
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

notification:
  image:
    repository: ghcr.io/tagent-ai/notification
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

web:
  replicaCount: 1
  image:
    repository: ghcr.io/tagent-ai/web
    tag: ""
    pullPolicy: IfNotPresent
  apiUrl: "http://tagent-api-gateway:8080"
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ===== LOCAL LLM (no cloud APIs) =====

ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  model: "llama3.1:8b"
  embeddingModel: "nomic-embed-text"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: "1", memory: 6Gi }
    limits: { cpu: "4", memory: 12Gi }

# ===== NIGHT GUARDIAN =====

nightGuardian:
  enabled: false
  confidence: "85"

# ===== ESCALATION =====

escalation:
  phoneDelayMin: "3"
  autoFixDelayMin: "10"
  quietStart: "22:00"
  quietEnd: "06:00"

# ===== SECRETS (override in your own values file) =====

secrets:
  databaseUrl: ""
  redisUrl: ""
  slackWebhookUrl: ""
  smtpHost: ""
  smtpUser: ""
  smtpPassword: ""

# ===== INGRESS =====

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tagent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ===== RBAC =====

rbac:
  create: true
