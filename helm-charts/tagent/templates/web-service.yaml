apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type | default "ClusterIP" }}
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "web") | nindent 4 }}
