{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  selector:
    {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "ollama") | nindent 4 }}
---
{{- if .Values.ollama.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ollama
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size | quote }}
  {{- with .Values.ollama.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "ollama") | nindent 8 }}
    spec:
      # Priority: allow Ollama to be evicted if the cluster is tight on resources.
      # It will be rescheduled when resources free up.
      priorityClassName: ""
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            # Keep Ollama lightweight on startup — models are pulled via the UI
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
          # Readiness: only mark ready when Ollama HTTP API responds
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: restart if Ollama becomes unresponsive
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Minimal resources — Ollama runs fine with low requests.
          # It uses more RAM only AFTER a model is loaded (via the UI).
          # This ensures the pod always schedules on any cluster.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # No limits — Ollama dynamically uses resources based on the model
            # loaded. Small models use ~1GB, large models use 40GB+.
            # Kubernetes will schedule the pod easily with minimal requests,
            # and Ollama will use available resources when running inference.
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
      volumes:
        - name: data
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ollama
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
