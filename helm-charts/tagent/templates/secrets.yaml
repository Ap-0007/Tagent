apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default "postgresql://tagent:password@tagent-postgres:5432/tagent" | quote }}
  redis-url: {{ .Values.secrets.redisUrl | default "redis://tagent-redis:6379" | quote }}
  slack-webhook-url: {{ .Values.secrets.slackWebhookUrl | default "" | quote }}
  smtp-host: {{ .Values.secrets.smtpHost | default "" | quote }}
  smtp-user: {{ .Values.secrets.smtpUser | default "" | quote }}
  smtp-password: {{ .Values.secrets.smtpPassword | default "" | quote }}
