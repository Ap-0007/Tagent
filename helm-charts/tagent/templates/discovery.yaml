apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "discovery") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "discovery") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-discovery
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: discovery
        image: "{{ .Values.discovery.image.repository }}:{{ .Values.discovery.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.discovery.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: database-url
        - name: KAFKA_BROKERS
          value: "{{ .Release.Name }}-kafka:9092"
        resources:
          {{- toYaml .Values.discovery.resources | nindent 12 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-discovery
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  selector:
    {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "discovery") | nindent 4 }}
