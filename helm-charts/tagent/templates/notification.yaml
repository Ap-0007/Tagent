apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-notification
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "notification") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "notification") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: notification
        image: "{{ .Values.notification.image.repository }}:{{ .Values.notification.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.notification.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8085
        env:
        - name: PORT
          value: "8085"
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: slack-webhook-url
              optional: true
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: smtp-host
              optional: true
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: smtp-user
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: smtp-password
              optional: true
        - name: SMTP_FROM
          value: {{ .Values.notification.smtpFrom | default "" | quote }}
        - name: SMTP_TO
          value: {{ .Values.notification.smtpTo | default "" | quote }}
        - name: KAFKA_BROKERS
          value: "{{ .Release.Name }}-kafka:9092"
        - name: ESCALATION_ENABLED
          value: {{ .Values.escalation.enabled | default "false" | quote }}
        - name: ESCALATION_PHONE_DELAY_MIN
          value: {{ .Values.escalation.phoneDelayMin | default "3" | quote }}
        - name: ESCALATION_AUTO_FIX_DELAY_MIN
          value: {{ .Values.escalation.autoFixDelayMin | default "10" | quote }}
        - name: ESCALATION_MIN_SEVERITY
          value: {{ .Values.escalation.minSeverity | default "high" | quote }}
        resources:
          {{- toYaml .Values.notification.resources | nindent 12 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-notification
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8085
    targetPort: 8085
  selector:
    {{- include "tagent.selectorLabels" (dict "Release" .Release "component" "notification") | nindent 4 }}
